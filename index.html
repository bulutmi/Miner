<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Kurbağa için özel tasarlanan form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Karşılama Popup -->
    <div id="welcomePopup" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="text-4xl mb-3">🐸</div>
            <h3 class="text-xl font-bold text-emerald-400 mb-2"> Kurbağa için özel tasarlanan form </h3> 
            <p class="text-slate-300 text-sm mb-6">Yazdığın herşey  güvenle iletiliyor.</p>
            <button onclick="closePopup()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/20 cursor-pointer">
                Sisteme Gir
            </button>
        </div>
    </div>

    <!-- Ana İçerik -->
    <main class="w-full max-w-lg bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl">
        <div class="text-center mb-6">
            <span class="text-3xl">🐸</span>
            <h1 class="text-2xl font-black tracking-tight mt-2 text-white">MİNER  Portalı</h1>
            <p class="text-sm text-slate-400 mt-1">Görüş, öneri veya şikayetlerini bizzat MİNER'e  ilet.</p>
        </div>

        <form action="https://formspree.io/f/maenyzld" method="POST" id="cimerForm" class="space-y-4">
            <div>
                <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Adın / Soyadın (İsteğe Bağlı)</label>
                <input type="text" id="name" name="isim" placeholder="Adını yazabilirsin..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition text-slate-100">
            </div>

            <div>
                <label for="message" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Şikayet Metni</label>
                <textarea id="message" name="sikayet" rows="5" required placeholder="CİMER'e yazar gibi içini dök..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:outline-none focus:border-emerald-500 transition resize-none text-slate-100"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/20 cursor-pointer">
                Şikayeti Gönder
            </button>
        </form>
    </main>

    <footer class="mt-8 text-xs text-slate-500 text-center">
        MİNER PORTAL © 2026
    </footer>

    <!-- Script Kontrolleri -->
    <script>
        function closePopup() {
            const popup = document.getElementById('welcomePopup');
            popup.style.opacity = '0';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 300);
        }

        const form = document.getElementById('cimerForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Gönderiliyor...';

            const formData = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    alert('Şikayetin başarıyla iletildi');
                    form.reset();
                } else {
                    alert('Gönderim sırasında bir hata oluştu, tekrar dene.');
                }
            } catch (error) {
                alert('Bağlantı hatası! İnternet bağlantını kontrol et.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şikayeti Gönder';
            }
        });
    </script>
</body>
</html>
